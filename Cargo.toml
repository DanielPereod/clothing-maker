[workspace]
resolver = "3"
members = ["crates/pattern", "crates/mesher", "crates/simulator", "crates/avatar", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
pattern = { path = "crates/pattern" }
mesher = { path = "crates/mesher" }
simulator = { path = "crates/simulator" }
avatar = { path = "crates/avatar" }

kurbo = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
spade = "2.15"
glam = "0.34"
rayon = "1.11"
bytemuck = { version = "1.25", features = ["derive"] }
eframe = { version = "0.37", features = ["persistence", "glow"] }
rfd = "0.17"
thiserror = "2"
gltf = { version = "1.4", default-features = false, features = ["names", "utils"] }

[profile.dev.package."*"]
opt-level = 2

# La simulación es muy lenta sin optimizar, también en los tests.
[profile.dev.package.simulator]
opt-level = 3
