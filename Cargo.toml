[workspace]
resolver = "3"
members = ["crates/pattern", "crates/mesher", "crates/simulator", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
pattern = { path = "crates/pattern" }
mesher = { path = "crates/mesher" }
simulator = { path = "crates/simulator" }

kurbo = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
spade = "2.15"
glam = "0.34"
eframe = { version = "0.37", features = ["persistence"] }
rfd = "0.17"
thiserror = "2"

[profile.dev.package."*"]
opt-level = 2
